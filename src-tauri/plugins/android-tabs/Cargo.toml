[package]
name = "tauri-plugin-android-tabs"
version = "0.1.0"
authors = ["Veloce"]
description = "Native Android WebView tab adapter for Veloce Browser"
edition = "2021"
rust-version = "1.77"
exclude = ["/target", "/node_modules"]
links = "tauri-plugin-android-tabs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
