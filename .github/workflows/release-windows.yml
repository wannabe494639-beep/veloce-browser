name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish NSIS installer
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Veloce Browser ${{ github.ref_name }}
          releaseBody: |
            Windows x64 installer for Veloce Browser.

            Requires the Microsoft Edge WebView2 Runtime. Review the project README and bundled third-party notices before installing.
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: VeloceBrowser-Setup-x64[ext]
          args: --bundles nsis
