name: Windows release

on:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows installer
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    outputs:
      release_tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish NSIS installer
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.release-tag.outputs.tag }}
          releaseName: Veloce Browser ${{ steps.release-tag.outputs.tag }}
          releaseBody: |
            Windows x64 installer for Veloce Browser.

            Requires the Microsoft Edge WebView2 Runtime. Review the project README and bundled third-party notices before installing.
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: VeloceBrowser-Setup-x64[ext]
          args: --bundles nsis

      - name: Create clean source archive
        run: git archive --format=zip --prefix=Veloce-Browser/ --output=VeloceBrowser-Source.zip "${{ github.sha }}"

      - name: Attach source archive to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.release-tag.outputs.tag }}" VeloceBrowser-Source.zip --clobber

  linux-packages:
    name: Build Linux packages
    needs: windows-installer
    if: needs.windows-installer.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libfuse2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Linux packages
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.windows-installer.outputs.release_tag }}
          releaseName: Veloce Browser ${{ needs.windows-installer.outputs.release_tag }}
          releaseBody: |
            Windows x64 installer and Linux x64 packages for Veloce Browser.

            Linux builds use WebKitGTK; extension support differs from Windows WebView2. Review the project README and bundled third-party notices before installing.
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: VeloceBrowser-Linux-x64[ext]
          args: --bundles appimage,deb

